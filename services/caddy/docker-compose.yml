services:
  caddy:
    image: caddy:2-alpine
    container_name: domain-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - domain_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # DOMAINSERV-131: limite de memoria. Sin esto un POST grande a Caddy puede
    # llevarse la RAM del HOST, que es el mismo que corre las 4 bases de datos de
    # clientes. Verificado: un body de 300MB con 512m de limite mata al container
    # (OOMKilled, exit 137) — con limite muere Caddy y se reinicia solo; sin
    # limite el OOM killer del kernel elige victima y puede tocarle a Postgres.
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  domain_internal:
    name: domain_internal
    external: true

volumes:
  caddy_data:
    name: domain_caddy_data
  caddy_config:
    name: domain_caddy_config
