services:
  caddy:
    # DOMAINSERV-124/130: imagen propia con el bouncer de CrowdSec y el plugin de
    # rate limiting. Ya NO es caddy:2-alpine — ese binario no trae los modulos y
    # el Caddyfile, que ahora usa la directiva `crowdsec`, no adaptaria.
    #
    # `build` + `image` juntos a proposito: compose la construye si falta (primer
    # deploy en un host limpio) y la reusa si ya esta. install.sh la buildea
    # explicito para que un cambio en el Dockerfile se recoja igual.
    #
    # Verificado en el build 2026-07-25 (caddy v2.11.4): los modulos presentes son
    # crowdsec, http.handlers.crowdsec, admin.api.crowdsec y http.handlers.rate_limit.
    image: domain-caddy:plugins
    build:
      context: .
    container_name: domain-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # la consumen los dos lados: Caddy para autenticarse contra la LAPI y
      # CrowdSec via BOUNCER_KEY_caddy para registrar este bouncer. install.sh la
      # genera una sola vez en el .env — si se regenera, el bouncer queda
      # fallando ABIERTO en silencio.
      CROWDSEC_BOUNCER_API_KEY: ${CROWDSEC_BOUNCER_API_KEY:-}
      # DOMAINSERV-204: dominio del panel. Vacío = el panel se sigue sirviendo por el
      # bloque `:80` sin TLS, que es el estado actual. Al definirlo, Caddy emite el cert
      # por HTTP-01 y Django prende SESSION_COOKIE_SECURE/CSRF_COOKIE_SECURE por default.
      # El default `admin.localhost` usa la CA interna de Caddy: no consume rate limit de
      # Let's Encrypt ni falla si no hay DNS. Es un valor de ambiente, no un secreto.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - domain_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # DOMAINSERV-131: limite de memoria. Sin esto un POST grande a Caddy puede
    # llevarse la RAM del HOST, que es el mismo que corre las 4 bases de datos de
    # clientes. Verificado: un body de 300MB con 512m de limite mata al container
    # (OOMKilled, exit 137) — con limite muere Caddy y se reinicia solo; sin
    # limite el OOM killer del kernel elige victima y puede tocarle a Postgres.
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  domain_internal:
    name: domain_internal
    external: true

volumes:
  caddy_data:
    name: domain_caddy_data
  caddy_config:
    name: domain_caddy_config
