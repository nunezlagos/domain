name: release-installer

# REQ-54: build cross-platform del binario domain-install y publica como
# GitHub Release. Se dispara con push de tag v*.
#
# bootstrap.sh (issue-57.1 fase 2) y bootstrap.ps1 (DOMAINSERV-271) bajan estos assets y los
# verifican contra SHA256SUMS.txt; "instalar Go local + compilar" quedó como FALLBACK para las
# arquitecturas que esta matriz no publica y para cuando la descarga falla.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # build manual desde la UI

permissions:
  contents: write  # necesario para subir release assets

# El working-directory va POR JOB y no en un defaults global, y no es estilo: cuando estaba
# arriba, el job release heredaba install-user/ para todos sus `run:`, pero download-artifact
# es una ACTION y descarga en $GITHUB_WORKSPACE/artifacts. El `find artifacts` del flatten
# buscaba dentro de install-user/, donde ese directorio no existe, y el job moría ahí.
# Se descubrió con el primer tag del proyecto (v0.3.0, run_number=1): el workflow existía
# desde REQ-54 y su segundo job NUNCA se había ejecutado.

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: install-user
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Sin go.sum porque el módulo install-user es stdlib-only
          cache: false

      # issue-57.1 REQ-1: los binarios que la gente descarga son justamente los que hay que
      # comparar contra el server. Sin -X salen sin versión y el aviso de actualización no
      # tiene con qué comparar. workflow_dispatch no corre sobre un tag, así que ahí la
      # versión queda como build de desarrollo en vez de fingir un número de release.
      - name: Build domain-install (${{ matrix.os }}/${{ matrix.arch }})
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          out="dist/domain-install-${{ matrix.os }}-${{ matrix.arch }}${ext}"
          version="dev"
          case "$GITHUB_REF_NAME" in v*) version="$GITHUB_REF_NAME" ;; esac
          go build -ldflags "-s -w -X main.Version=$version -X main.Commit=${GITHUB_SHA::7} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "$out" .
          "$out" --version 2>/dev/null || true
          ls -lh "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: domain-install-${{ matrix.os }}-${{ matrix.arch }}
          path: install-user/dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into single dir
        run: |
          mkdir -p release
          find artifacts -type f -name 'domain-install-*' -exec cp {} release/ \;
          ls -lh release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum domain-install-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/domain-install-*
            release/SHA256SUMS.txt
