name: CI mcp

on:
  push:
    # DOMAINSERV-192: `main` faltaba desde que el trabajo se migró de la rama services.
    # Durante ese tiempo el push a main solo disparaba "CI install-user", que valida otro
    # módulo: un check verde que no decía nada de domain-mcp
    branches: [services, main]
    paths:
      - 'services/domain-mcp/**'
      - '.github/workflows/ci-mcp.yml'
  pull_request:
    paths:
      - 'services/domain-mcp/**'
      - '.github/workflows/ci-mcp.yml'

defaults:
  run:
    working-directory: services/domain-mcp

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: services/domain-mcp/go.sum
      # ubuntu-latest no trae zsh y TestSyntaxCheck lo invoca (DOMAINSERV-197)
      - name: Install zsh (lo exige TestSyntaxCheck)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # -count=1 desactiva el cache de test. Es obligatorio, no una precaución: hay
      # tests que leen archivos de FUERA del módulo Go (install.sh, .env.example, los
      # scripts de services/) con paths relativos, y Go no los rastrea para invalidar
      # el cache. Medido: degradando gen_master_key a 16 bytes, la suite seguía en
      # verde con cache y solo falló con -count=1. Con `cache: true` en setup-go ese
      # falso verde también ocurre acá.
      - name: go test unit
        run: go test -count=1 -race -timeout=5m ./...

  integration-tests:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: services/domain-mcp/go.sum
      # este job corre toda la suite, así que arrastra el mismo TestSyntaxCheck
      - name: Install zsh (lo exige TestSyntaxCheck)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run integration suite
        run: go test -race -tags=integration -timeout=20m ./...

  db-conventions-lint:
    name: db-conventions-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/db-conv-lint ./cmd/db-conventions-lint
      # 146 -> 278: el job nunca corrió en main y se acumularon 88 violaciones
      # en migraciones ya aplicadas, no corregibles retroactivamente (DOMAINSERV-198)
      - name: Lint migrations
        run: /tmp/db-conv-lint --dir internal/migrate/migrations -baseline 278

  response-shape-lint:
    name: response-shape-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/response-shape-lint ./cmd/response-shape-lint
      - name: Lint API response shapes + snapshots
        run: /tmp/response-shape-lint -verbose

  mcp-result-lint:
    name: mcp-result-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/mcp-result-lint ./cmd/mcp-result-lint
      - name: Lint MCP tool results armados a mano
        run: /tmp/mcp-result-lint -verbose

  stateless-lint:
    name: stateless-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/stateless-lint ./cmd/domain-lint-stateless
      - name: Lint invariante stateless
        run: /tmp/stateless-lint ./...

  size-lint:
    name: size-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/size-lint ./cmd/size-lint
      - name: Lint tamaño de funciones (baseline)
        run: /tmp/size-lint -dir . -baseline .size-lint-baseline

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
