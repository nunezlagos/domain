name: CI install-user

# install-user/ es su propio módulo Go (nunezlagos/domain-install) y hasta ahora no tenía
# ningún workflow: ci-mcp.yml corre con working-directory services/domain-mcp y solo se
# dispara ante services/domain-mcp/**, y release-installer.yml hace `go build` sin correr
# tests. O sea que el binario que se publica como Release se compilaba sin que nada
# ejecutara la suite. Este workflow cierra ese hueco.

# DOMAINSERV-272: el filtro decía install-user/** porque se asumía que el módulo era
# autocontenido, y NO lo es: version_test.go:70, :92 y :123 asertan sobre release-installer.yml,
# ci-mcp.yml, ci-shell-guards.yml y benchmarks-mcp.yml, leyéndolos con
# filepath.Join("..", ".github", "workflows", …). MEDIDO en la historia real: de los 18 commits
# que tocaron esos cuatro archivos, 15 NO dispararon este job — el guard de inyección de versión
# y el de ramas quedaban sin correr hasta el próximo cambio del instalador. Entre ellos ecd5acf9,
# que modificó ci-shell-guards.yml, que es exactamente lo que version_test.go:123 lee.
on:
  push:
    branches: [main, develop]
    paths:
      - 'install-user/**'
      - '.github/workflows/**'
      # el job size-lint compila el linter desde acá (ver el step "size-lint" más abajo)
      - 'services/domain-mcp/cmd/size-lint/**'
  pull_request:
    paths:
      - 'install-user/**'
      - '.github/workflows/**'
      - 'services/domain-mcp/cmd/size-lint/**'

defaults:
  run:
    working-directory: install-user

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # el módulo es stdlib-only: no hay go.sum que cachear
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      # DOMAINSERV-270: el instalador declara soportar Linux, macOS y Windows, y hasta acá
      # NADA fuera de ubuntu-latest se ejecutaba nunca. Esto cierra la mitad barata del
      # hueco —que el código COMPILE en los tres— desde el mismo runner Linux, o sea a
      # costo cero.
      #
      # LO QUE ESTO **NO** CUBRE, y conviene tenerlo escrito para que nadie lea este step
      # como "multiplataforma verificado":
      #   · DOMAINSERV-266 (sha256sum ausente en macOS) es de RUNTIME, no de compilación.
      #     Medido acá simulando la ausencia del binario: 10 tests fallan. Este step los
      #     deja pasar porque no ejecuta nada.
      #   · Windows tampoco queda cubierto: 7 archivos de test hacen exec.Command("bash", …)
      #     y el módulo es UN solo paquete, así que no se pueden excluir selectivamente.
      #     Es DOMAINSERV-271/273.
      # Correr los runners nativos se evaluó y se descartó por costo: macOS factura 10x el
      # minuto y este directorio recibió 50 commits en 30 días con una suite de ~62s.
      - name: build cross-platform (compila, no ejecuta)
        run: |
          set -euo pipefail
          for par in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64; do
            GOOS="${par%/*}" GOARCH="${par#*/}" go build -o /dev/null .
            echo "ok  build $par"
          done
          # windows/arm64 va a propósito aunque release-installer.yml todavía no lo publique:
          # que compile es la precondición para agregarlo a la matriz de release.
          for par in darwin/arm64 windows/amd64; do
            GOOS="${par%/*}" GOARCH="${par#*/}" go vet ./...
            echo "ok  vet   $par"
          done

      # los hooks se distribuyen como scripts, así que un error de sintaxis no aparece
      # hasta que el hook corre en la máquina de alguien
      - name: Sintaxis de los hooks y guards shell
        run: |
          for f in hooks/*.sh templates/agents-hooks/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" && echo "ok  $f"
          done

      # bash -n solo prueba que el script PARSEE. Las suites de abajo verifican qué
      # DECIDE cada hook, y hasta ahora ninguna corría en ningún pipeline: el hueco de
      # --output en git-archaeology-guard vivió sin que nadie lo viera precisamente por
      # eso. Fallar el job si una suite falla, y también si no se encontró ninguna:
      # un glob que no matchea dejaría el step verde sin haber probado nada.
      - name: Suites de los hooks y guards shell
        run: |
          fails=0
          found=0
          for f in hooks/*_test.sh templates/agents-hooks/*_test.sh; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            if bash "$f"; then
              echo "PASS  $f"
            else
              echo "FAIL  $f"
              fails=$((fails + 1))
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "ninguna suite encontrada: el glob no matcheó y este step no probó nada"
            exit 1
          fi
          echo "$found suite(s), $fails fallo(s)"
          [ "$fails" -eq 0 ]

  size-lint:
    name: size-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum

      # el linter vive en el módulo de services/domain-mcp, así que se compila desde ahí
      # y se apunta a este directorio
      - name: Build linter
        working-directory: services/domain-mcp
        run: go build -o /tmp/size-lint ./cmd/size-lint

      - name: Lint tamaño de funciones (baseline)
        run: /tmp/size-lint -dir . -baseline .size-lint-baseline
