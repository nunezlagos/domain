# HU-45.1: deploy del admin Django placeholder.
# Build local. Reemplaza el sunset de REQ-41 (Angular CoreUI) en commit 5d03726.
#
# Caddy (services/caddy/Caddyfile) ya rutea /* → domain-admin:80.
# Makefile (services/Makefile) ya tiene SVC=admin que mapea a este compose.

services:
  domain-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: domain-admin:local
    container_name: domain-admin
    restart: unless-stopped
    environment:
      # HU-45.1 sin DB todavía. HU-45.2 sumará DATABASES + read replica config.
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONUNBUFFERED: "1"
      # HU-47.1: credenciales master del admin.
      # Sin default para la password ni para la clave de firma: el compose FALLA
      # a propósito si el .env no las trae. Un default acá es la puerta del panel
      # abierta con un valor publicado en el repo (DOMAINSERV-203). install.sh las
      # rota: están en el mapa CREDS.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?definí ADMIN_PASSWORD en el .env — install.sh la genera}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?definí DJANGO_SECRET_KEY en el .env — install.sh la genera}
      # DOMAINSERV-204: hardening de sesión. Los defaults viven ACÁ y no en el
      # .env.example porque install.sh, sobre un .env que ya existe, solo
      # re-siembra el array CREDS: una variable nueva no secreta NUNCA llega al
      # .env de prod, así que el default del compose es el único valor que corre
      # en el VPS.
      #
      # localhost es obligatorio en ALLOWED_HOSTS: el healthcheck de abajo pega a
      # http://localhost/ y sin ese host Django responde 400 y el container queda
      # unhealthy para siempre.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-13.140.183.236,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://13.140.183.236,http://localhost}
      # Quedan en 0 a propósito: el panel se sirve por http en el bloque :80 del
      # Caddyfile y una cookie Secure sobre http no vuelve nunca. Se prenden en el
      # mismo cambio que ponga TLS en el origen, no antes (criterio 2 del ticket).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}
      # HU-48.1: conexión a Postgres compartido (mismas vars que domain-mcp).
      POSTGRES_DB: ${POSTGRES_DB:-domain}
      DB_APP_USER: ${POSTGRES_DB_USER:-app_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      # Passphrase de cifrado at-rest de API keys (pgcrypto). DEBE ser identica a
      # la de domain-mcp; el admin descifra key_ciphertext para mostrar la key.
      DOMAIN_FIELD_ENC_KEY: ${DOMAIN_FIELD_ENC_KEY}
      # HU-49.1: provider LLM del chat IA (default: minimax).
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      MINIMAX_REGION: ${MINIMAX_REGION:-international}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    networks:
      - domain_internal
    expose:
      - "80"
    healthcheck:
      # gunicorn responde HTTP en /; usamos wget (presente en python:3.12-slim? no,
      # viene busybox-like). Mejor usar python -c para no asumir binarios extra.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost/', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  domain_internal:
    name: domain_internal
    external: true