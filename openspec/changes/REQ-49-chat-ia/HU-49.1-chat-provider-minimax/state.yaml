notes: |
  Esta HU es FUNDACION: HU-49.2 y HU-49.3 dependen de esta. MiniMax expone una API
  compatible con Anthropic (mensajes en formato Anthropic Messages API), por eso
  reutilizamos la SDK oficial de anthropic y solo cambiamos base_url + headers.
  Patron copiado de saargo_curriculum (backend Laravel) que ya tiene la misma
  abstraccion LlmFactory + LlmProvider con GeminiProvider + AnthropicProvider.
  Aca en Python el patron es identico, solo cambia el transport (SDK vs HTTP).