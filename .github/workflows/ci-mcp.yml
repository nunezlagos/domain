name: CI mcp

on:
  push:
    # DOMAINSERV-192: `main` faltaba desde que el trabajo se migró de la rama services.
    # Durante ese tiempo el push a main solo disparaba "CI install-user", que valida otro
    # módulo: un check verde que no decía nada de domain-mcp
    branches: [services, main]
    paths:
      - 'services/domain-mcp/**'
      - '.github/workflows/ci-mcp.yml'
  pull_request:
    paths:
      - 'services/domain-mcp/**'
      - '.github/workflows/ci-mcp.yml'

defaults:
  run:
    working-directory: services/domain-mcp

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: services/domain-mcp/go.sum
      # ubuntu-latest no trae zsh y TestSyntaxCheck lo invoca (DOMAINSERV-197)
      - name: Install zsh (lo exige TestSyntaxCheck)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # -count=1 desactiva el cache de test. Es obligatorio, no una precaución: hay
      # tests que leen archivos de FUERA del módulo Go (install.sh, .env.example, los
      # scripts de services/) con paths relativos, y Go no los rastrea para invalidar
      # el cache. Medido: degradando gen_master_key a 16 bytes, la suite seguía en
      # verde con cache y solo falló con -count=1. Con `cache: true` en setup-go ese
      # falso verde también ocurre acá.
      - name: go test unit
        run: go test -count=1 -race -timeout=5m ./...

  integration-tests:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: services/domain-mcp/go.sum
      # este job corre toda la suite, así que arrastra el mismo TestSyntaxCheck
      - name: Install zsh (lo exige TestSyntaxCheck)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run integration suite
        run: go test -race -tags=integration -timeout=20m ./...

  db-conventions-lint:
    name: db-conventions-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/db-conv-lint ./cmd/db-conventions-lint
      # 146 -> 278: el job nunca corrió en main y se acumularon 88 violaciones
      # en migraciones ya aplicadas, no corregibles retroactivamente (DOMAINSERV-198)
      #
      # 278 -> 282 (DOMAINSERV-234): el job estaba ROJO y nadie lo había notado. Las 5
      # violaciones son de 000279 (header sin breaking/estimated_duration + un CREATE INDEX
      # sin CONCURRENTLY) y 000282 (mismo header). Las dos están APLICADAS en prod, y la
      # policy migracion-aplicada-no-se-edita prohíbe tocarlas: "un header inventado a
      # posteriori documenta una intención que nadie tuvo; vale menos que su ausencia", y el
      # CREATE INDEX sin CONCURRENTLY es irreparable porque el lock ya ocurrió.
      #
      # Subir el baseline es para lo que el baseline existe. Las migraciones 283 a 287 siguen
      # verificadas: el guard mide lo nuevo, que es su contrato.
      - name: Lint migrations
        run: /tmp/db-conv-lint --dir internal/migrate/migrations -baseline 282

  response-shape-lint:
    name: response-shape-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/response-shape-lint ./cmd/response-shape-lint
      - name: Lint API response shapes + snapshots
        run: /tmp/response-shape-lint -verbose

  mcp-result-lint:
    name: mcp-result-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/mcp-result-lint ./cmd/mcp-result-lint
      - name: Lint MCP tool results armados a mano
        run: /tmp/mcp-result-lint -verbose

  stateless-lint:
    name: stateless-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/stateless-lint ./cmd/domain-lint-stateless
      - name: Lint invariante stateless
        run: /tmp/stateless-lint ./...

  size-lint:
    name: size-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Build linter
        run: go build -o /tmp/size-lint ./cmd/size-lint
      - name: Lint tamaño de funciones (baseline)
        run: /tmp/size-lint -dir . -baseline .size-lint-baseline

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/go.sum
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # DOMAINSERV-234: los dos jobs de test corren con -race, así que un archivo con
  # `//go:build !race` NO lo compilaba NINGUNO. Medido con go list, que es autoritativo:
  # `go list -tags race -f '{{.TestGoFiles}}' ./internal/httpserver/` no incluía
  # listen_e2e_test.go, o sea que sus 3 tests no existían en CI.
  #
  # skill_type_cleanup_test.go perdió el tag —era gratuito, no spawnea subprocesos— y ya
  # entra en el job unitario. listen_e2e_test.go SÍ lanza subprocesos con exec.Command, y
  # ahí el tag es legítimo: el race detector no conversa bien con eso. Por eso este job
  # existe en vez de borrar el tag: corre exactamente esos tests SIN -race.
  e2e-sin-race:
    name: E2E excluidos por -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: services/domain-mcp/go.sum
      - name: go test sin -race (los archivos con //go:build !race)
        run: go test -count=1 -timeout=5m ./internal/httpserver/ ./internal/admin/
      # Sin esto el job puede quedar verde por vacío: si mañana alguien borra el tag o
      # mueve el archivo, queremos enterarnos acá y no descubrir el hueco de nuevo.
      - name: el archivo con el tag tiene que seguir existiendo
        run: |
          set -euo pipefail
          if ! grep -rq 'go:build !race' internal/httpserver/; then
            echo "internal/httpserver ya no tiene archivos con //go:build !race."
            echo "Si el tag se quitó, estos tests ya corren en el job unitario y este job sobra:"
            echo "borralo en vez de dejarlo pasando en vacío (DOMAINSERV-234)."
            exit 1
          fi

  # DOMAINSERV-234: los 3 SDKs son la cara externa del producto y ningún job los tocaba.
  # `go list ./...` desde services/domain-mcp devuelve CERO paquetes de sdks porque
  # sdks/go/go.mod declara un módulo APARTE, y ./... no desciende a módulos anidados.
  sdk-tests:
    name: SDKs publicados (go, python, typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/domain-mcp/sdks/go/go.sum
      - name: SDK go
        working-directory: services/domain-mcp/sdks/go
        run: go test -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SDK python
        working-directory: services/domain-mcp/sdks/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e . pytest
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SDK typescript
        working-directory: services/domain-mcp/sdks/typescript
        run: |
          set -euo pipefail
          npm ci || npm install
          npm test
