{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain</title>
  <meta name="description" content="Acceso al portal de Domain.">
  <meta name="theme-color" content="#faf8f2">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="{% static 'demo/brand/favicon.svg' %}">
  <link rel="icon" href="{% static 'demo/brand/favicon.ico' %}" sizes="any">
  <link rel="apple-touch-icon" href="{% static 'demo/brand/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'demo/brand/site.webmanifest' %}">
  <script>
    (function () {
      try {
        if (window.localStorage.getItem('domain-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'demo/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'landing/landing.css' %}">
</head>
<body>

<button type="button" class="btn-mode" id="modeToggle" aria-label="Cambiar modo de color">
  <i class="fas fa-moon icon-moon" aria-hidden="true"></i>
  <i class="fas fa-sun icon-sun" aria-hidden="true"></i>
</button>

<main class="gate">
  <div class="gate-bg" aria-hidden="true">
    <div class="gate-grid"></div>
    <div class="gate-orb"></div>
  </div>

  <div class="gate-card">
    <img class="gate-logo" src="{% static 'demo/brand/logo-animated.svg' %}"
         alt="" width="72" height="72">
    <h1 class="gate-title">Domain</h1>
    <p class="gate-lead">Memoria, políticas y trazabilidad para equipos que trabajan con agentes.</p>
    <a href="{% url 'login' %}" class="gate-action">
      <i class="fas fa-arrow-right-to-bracket" aria-hidden="true"></i>
      Entrar
    </a>
  </div>
</main>

<script src="{% static 'landing/landing.js' %}" defer></script>

</body>
</html>
